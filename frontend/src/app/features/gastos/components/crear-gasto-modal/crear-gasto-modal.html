<div class="modal-overlay" (click)="onCerrar()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Registrar Gasto</h2>
      <button type="button" class="modal-close" (click)="onCerrar()">
        <img src="/images/cancel.png" alt="Cerrar" class="modal-close-img">
      </button>
    </div>
    <div class="modal-body">
      <input class="field-input" type="date" placeholder="Fecha de gasto"
        [ngModel]="fecha()" (ngModelChange)="fecha.set($event)" />

      <input class="field-input" type="text" placeholder="Descripción del gasto"
        [ngModel]="descripcion()" (ngModelChange)="descripcion.set($event)" />

      <input class="field-input" type="number" min="0" step="0.01" placeholder="Monto"
        [ngModel]="monto()" (ngModelChange)="monto.set($event)" />

      <app-dropdown-select label="Forma de pago" [options]="opcionesFormaPago"
        [value]="formaPago()" (valueChange)="formaPago.set($any($event))"></app-dropdown-select>

      <app-dropdown-select label="Estado" [options]="opcionesEstado"
        [value]="estado()" (valueChange)="estado.set($any($event))"></app-dropdown-select>

      <app-dropdown-select label="Categoría" [options]="opcionesCategoria"
        [value]="categoria()" (valueChange)="categoria.set($any($event))"></app-dropdown-select>

      @if (errorMensaje()) {
        <p class="field-error">{{ errorMensaje() }}</p>
      }
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-guardar" (click)="onGuardar()" [disabled]="guardando()">
        {{ guardando() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </div>
</div>
