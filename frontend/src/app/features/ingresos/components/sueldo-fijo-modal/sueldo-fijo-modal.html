<div class="modal-overlay" (click)="onCerrar()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Sueldo Fijo</h2>
      <button type="button" class="modal-close" (click)="onCerrar()">
        <img src="/images/cancel.png" alt="Cerrar" class="modal-close-img">
      </button>
    </div>
    <div class="modal-body">
      <input class="field-input" type="number" min="0" step="0.01" placeholder="Monto"
        [ngModel]="monto()" (ngModelChange)="monto.set($event)" />
      <input class="field-input" type="date" placeholder="Fecha"
        [ngModel]="fecha()" (ngModelChange)="fecha.set($event)" />
      <app-dropdown-select label="Método de pago" [options]="opcionesMetodoPago"
        [value]="metodoPago()" (valueChange)="metodoPago.set($any($event))"></app-dropdown-select>
      <app-dropdown-select label="Cuenta o destino" [options]="opcionesCuentaDestino"
        [value]="cuentaDestino()" (valueChange)="cuentaDestino.set($any($event))"></app-dropdown-select>
      @if (errorMensaje()) { <p class="field-error">{{ errorMensaje() }}</p> }
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-guardar" (click)="onGuardar()">Guardar</button>
    </div>
  </div>
</div>
