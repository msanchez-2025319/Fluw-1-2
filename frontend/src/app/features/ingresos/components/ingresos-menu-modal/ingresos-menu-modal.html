<div class="modal-overlay" (click)="onCerrar()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Ingresos</h2>
      <button class="modal-close" (click)="onCerrar()">
        <img src="/images/cancel.png" alt="Cerrar" class="modal-close-img">
      </button>
    </div>
    <div class="modal-body">
      <button type="button" class="menu-option" (click)="onSeleccionar('SUELDO_EXTRA')">Ingresos extras <span class="chevron">&gt;</span></button>
      <button type="button" class="menu-option" (click)="onSeleccionar('SUELDO_VARIADO')">Ingresos variables <span class="chevron">&gt;</span></button>
    </div>
  </div>
</div>
