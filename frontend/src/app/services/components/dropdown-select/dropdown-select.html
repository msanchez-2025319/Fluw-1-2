<div class="dropdown">
  <button type="button" class="dropdown-trigger" (click)="toggle()">
    <span>{{ selectedLabel }}</span>
    <span class="dropdown-arrow" [class.open]="isOpen()">&#9662;</span>
  </button>
  @if (isOpen()) {
    <div class="dropdown-backdrop" (click)="close()"></div>
    <ul class="dropdown-list">
      @for (option of options; track option.value) {
        <li><button type="button" class="dropdown-option" (click)="select(option)">{{ option.label }}</button></li>
      }
    </ul>
  }
</div>
